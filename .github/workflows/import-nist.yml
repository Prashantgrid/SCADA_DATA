name: Import verified NIST PV dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-nist.yml
      - scripts/import_nist.py

permissions:
  contents: write

concurrency:
  group: import-nist-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install public download client
        run: python -m pip install websockets==16.0
      - name: Download and verify original archives
        run: python scripts/import_nist.py
      - name: Commit verified dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIST_PV_2015_2018/raw/ NIST_PV_2015_2018/documentation/*.pdf
          if git diff --cached --quiet; then
            echo "All NIST data are already committed."
            exit 0
          fi
          git commit -m "Add verified NIST one-minute PV and weather archives, 2015–2018"
          git pull --rebase origin main
          git -c pack.threads=2 -c pack.window=0 push origin HEAD:main
